openapi: 3.0.3
info:
  title: Apache CouchDB API
  description: |
    OpenAPI description of the Apache CouchDB 3.x HTTP API.
    This is the single source of truth for all generated CouchDB SDKs.
  version: 0.4.0
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
externalDocs:
  url: https://docs.couchdb.org/en/stable/api/index.html
servers:
  - url: http://localhost:5984
    description: Local CouchDB
security:
  - basicAuth: []
  - cookieAuth: []
tags:
  - name: server
    description: Server-level information and utilities
  - name: authentication
    description: Cookie session authentication
  - name: databases
    description: Create, inspect and delete databases
  - name: documents
    description: Read and write JSON documents
  - name: design-documents
    description: Design documents and MapReduce views
  - name: query
    description: All-docs and Mango queries and indexes
  - name: changes
    description: Database changes feed
  - name: attachments
    description: Binary attachments on documents
  - name: replication
    description: One-off and continuous replication
  - name: security
    description: Per-database admins and members
  - name: partitions
    description: Queries scoped to a partition of a partitioned database

paths:
  /:
    get:
      tags: [server]
      operationId: getServerInformation
      summary: Server meta information
      security: []
      responses:
        "200":
          description: Server information
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerInformation" }

  /_up:
    get:
      tags: [server]
      operationId: getUp
      summary: Health check
      security: []
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpInformation" }
        "404":
          $ref: "#/components/responses/Error"

  /_all_dbs:
    get:
      tags: [server]
      operationId: getAllDbs
      summary: List all databases
      parameters:
        - { $ref: "#/components/parameters/Descending" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Skip" }
      responses:
        "200":
          description: Database names
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
        "401": { $ref: "#/components/responses/Error" }

  /_uuids:
    get:
      tags: [server]
      operationId: getUuids
      summary: Request server-generated UUIDs
      parameters:
        - name: count
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        "200":
          description: UUIDs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UuidsResult" }
        "401": { $ref: "#/components/responses/Error" }

  /_session:
    get:
      tags: [authentication]
      operationId: getSession
      summary: Get current session information
      responses:
        "200":
          description: Session info
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInformation" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      tags: [authentication]
      operationId: postSession
      summary: Start a cookie session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionRequest" }
      responses:
        "200":
          description: Session created; AuthSession cookie is set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionCreated" }
        "401":
          $ref: "#/components/responses/Error"
    delete:
      tags: [authentication]
      operationId: deleteSession
      summary: End the cookie session
      responses:
        "200":
          description: Session ended
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "401": { $ref: "#/components/responses/Error" }

  /{db}:
    parameters:
      - { $ref: "#/components/parameters/Db" }
    head:
      tags: [databases]
      operationId: headDatabase
      summary: Check database existence
      responses:
        "200": { description: Database exists }
        "404": { description: Database does not exist }
    get:
      tags: [databases]
      operationId: getDatabaseInformation
      summary: Get database information
      responses:
        "200":
          description: Database information
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatabaseInformation" }
        "404":
          $ref: "#/components/responses/Error"
    put:
      tags: [databases]
      operationId: putDatabase
      summary: Create a database
      parameters:
        - name: q
          in: query
          description: Number of shards
          schema: { type: integer, minimum: 1 }
        - name: n
          in: query
          description: Number of replicas
          schema: { type: integer, minimum: 1 }
        - name: partitioned
          in: query
          schema: { type: boolean, default: false }
      responses:
        "201":
          description: Database created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "202":
          description: Database created, quorum not met
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }
    delete:
      tags: [databases]
      operationId: deleteDatabase
      summary: Delete a database
      responses:
        "200":
          description: Database deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "202":
          description: Database deleted, quorum not met
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [documents]
      operationId: postDocument
      summary: Create a document with a server-generated id
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Document" }
      responses:
        "201":
          description: Document created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentResult" }
        "202":
          description: Document accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentResult" }
        "409": { $ref: "#/components/responses/Error" }

  /{db}/_all_docs:
    parameters:
      - { $ref: "#/components/parameters/Db" }
    post:
      tags: [query]
      operationId: postAllDocs
      summary: Query all documents
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AllDocsQuery" }
      responses:
        "200":
          description: Rows
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AllDocsResult" }
        "401": { $ref: "#/components/responses/Error" }

  /{db}/_bulk_docs:
    parameters:
      - { $ref: "#/components/parameters/Db" }
    post:
      tags: [documents]
      operationId: postBulkDocs
      summary: Create, update or delete documents in bulk
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkDocs" }
      responses:
        "201":
          description: Per-document results
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DocumentResult" }
        "401": { $ref: "#/components/responses/Error" }

  /{db}/_find:
    parameters:
      - { $ref: "#/components/parameters/Db" }
    post:
      tags: [query]
      operationId: postFind
      summary: Mango query
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FindQuery" }
      responses:
        "200":
          description: Matching documents
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FindResult" }
        "400": { $ref: "#/components/responses/Error" }

  /{db}/_index:
    parameters:
      - { $ref: "#/components/parameters/Db" }
    get:
      tags: [query]
      operationId: getIndexes
      summary: List Mango indexes
      responses:
        "200":
          description: Indexes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IndexesInformation" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      tags: [query]
      operationId: postIndex
      summary: Create a Mango index
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IndexDefinitionRequest" }
      responses:
        "200":
          description: Index created or already exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IndexResult" }
        "401": { $ref: "#/components/responses/Error" }

  /{db}/{docid}:
    parameters:
      - { $ref: "#/components/parameters/Db" }
      - { $ref: "#/components/parameters/DocId" }
    get:
      tags: [documents]
      operationId: getDocument
      summary: Get a document
      parameters:
        - name: rev
          in: query
          schema: { type: string }
        - name: revs_info
          in: query
          schema: { type: boolean, default: false }
        - name: conflicts
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: The document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [documents]
      operationId: putDocument
      summary: Create or update a document
      parameters:
        - { $ref: "#/components/parameters/IfMatch" }
        - name: rev
          in: query
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Document" }
      responses:
        "201":
          description: Document written
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentResult" }
        "202":
          description: Document accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentResult" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [documents]
      operationId: deleteDocument
      summary: Delete a document
      parameters:
        - { $ref: "#/components/parameters/IfMatch" }
        - name: rev
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Document deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentResult" }
        "202":
          description: Deletion accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentResult" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /{db}/_design/{ddoc}/_view/{view}:
    parameters:
      - { $ref: "#/components/parameters/Db" }
      - { $ref: "#/components/parameters/Ddoc" }
      - name: view
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [design-documents]
      operationId: postView
      summary: Query a MapReduce view
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ViewQuery" }
      responses:
        "200":
          description: View rows
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ViewResult" }
        "404": { $ref: "#/components/responses/Error" }

  /_replicate:
    post:
      tags: [replication]
      operationId: postReplicate
      summary: Run or cancel a one-off replication
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplicationRequest" }
      responses:
        "200":
          description: Replication finished
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReplicationResult" }
        "202":
          description: Continuous replication started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReplicationResult" }
        "404": { $ref: "#/components/responses/Error" }

  /{db}/_changes:
    parameters:
      - { $ref: "#/components/parameters/Db" }
      - name: feed
        in: query
        description: "`normal`/`longpoll` return one JSON object; `continuous` streams newline-delimited change objects. `eventsource` is not supported."
        schema: { type: string, enum: [normal, longpoll, continuous], default: normal }
      - name: since
        in: query
        description: Start after this sequence; `now` skips existing changes.
        schema: { type: string, default: "0" }
      - name: include_docs
        in: query
        schema: { type: boolean, default: false }
      - name: conflicts
        in: query
        description: Include `_conflicts` in docs; requires `include_docs`.
        schema: { type: boolean, default: false }
      - name: attachments
        in: query
        schema: { type: boolean, default: false }
      - name: style
        in: query
        description: "`all_docs` returns all leaf revisions, not just the winner."
        schema: { type: string, enum: [main_only, all_docs], default: main_only }
      - name: filter
        in: query
        description: "`_doc_ids`, `_selector`, `_design`, `_view` or `ddoc/filter`."
        schema: { type: string }
      - name: view
        in: query
        description: "`ddoc/view` used with `filter=_view`."
        schema: { type: string }
      - name: doc_ids
        in: query
        description: JSON array of ids, used with `filter=_doc_ids`.
        schema: { type: string }
      - { $ref: "#/components/parameters/Limit" }
      - name: timeout
        in: query
        description: Longpoll timeout in milliseconds
        schema: { type: integer, minimum: 0 }
      - name: heartbeat
        in: query
        description: Milliseconds between keep-alive newlines.
        schema: { type: integer, minimum: 0 }
      - name: seq_interval
        in: query
        description: Only compute `seq` every N rows; others are null. Faster on clusters.
        schema: { type: integer, minimum: 1 }
      - { $ref: "#/components/parameters/Descending" }
    get:
      tags: [changes]
      operationId: getChanges
      summary: Database changes feed (normal, longpoll or continuous)
      responses:
        "200":
          description: Changes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangesResult" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [changes]
      operationId: postChanges
      summary: Changes feed filtered by a body (`_doc_ids` or `_selector`)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangesQuery" }
      responses:
        "200":
          description: Changes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangesResult" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /{db}/_local/{docid}:
    parameters:
      - { $ref: "#/components/parameters/Db" }
      - { $ref: "#/components/parameters/DocId" }
    get:
      tags: [documents]
      operationId: getLocalDocument
      summary: Get a local (non-replicated) document
      responses:
        "200":
          description: The document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [documents]
      operationId: putLocalDocument
      summary: Create or update a local document
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Document" }
      responses:
        "201":
          description: Document written
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentResult" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [documents]
      operationId: deleteLocalDocument
      summary: Delete a local document
      parameters:
        - name: rev
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Document deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentResult" }
        "404": { $ref: "#/components/responses/Error" }

  /{db}/_security:
    parameters:
      - { $ref: "#/components/parameters/Db" }
    get:
      tags: [security]
      operationId: getSecurity
      summary: Get the database security object
      responses:
        "200":
          description: Security object
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Security" }
        "401": { $ref: "#/components/responses/Error" }
    put:
      tags: [security]
      operationId: putSecurity
      summary: Replace the database security object
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Security" }
      responses:
        "200":
          description: Security updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "401": { $ref: "#/components/responses/Error" }

  /{db}/_design/{ddoc}:
    parameters:
      - { $ref: "#/components/parameters/Db" }
      - { $ref: "#/components/parameters/Ddoc" }
    get:
      tags: [design-documents]
      operationId: getDesignDocument
      summary: Get a design document
      responses:
        "200":
          description: The design document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DesignDocument" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [design-documents]
      operationId: putDesignDocument
      summary: Create or update a design document
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DesignDocument" }
      responses:
        "201":
          description: Written
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentResult" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [design-documents]
      operationId: deleteDesignDocument
      summary: Delete a design document
      parameters:
        - name: rev
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentResult" }
        "404": { $ref: "#/components/responses/Error" }

  /{db}/_partition/{partition}/_all_docs:
    parameters:
      - { $ref: "#/components/parameters/Db" }
      - { $ref: "#/components/parameters/Partition" }
    post:
      tags: [partitions]
      operationId: postPartitionAllDocs
      summary: Query all documents in one partition
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AllDocsQuery" }
      responses:
        "200":
          description: Rows
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AllDocsResult" }
        "401": { $ref: "#/components/responses/Error" }

  /{db}/_partition/{partition}/_find:
    parameters:
      - { $ref: "#/components/parameters/Db" }
      - { $ref: "#/components/parameters/Partition" }
    post:
      tags: [partitions]
      operationId: postPartitionFind
      summary: Mango query within one partition
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FindQuery" }
      responses:
        "200":
          description: Matching documents
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FindResult" }
        "401": { $ref: "#/components/responses/Error" }

  /{db}/{docid}/{attname}:
    parameters:
      - { $ref: "#/components/parameters/Db" }
      - { $ref: "#/components/parameters/DocId" }
      - name: attname
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [attachments]
      operationId: getAttachment
      summary: Download an attachment
      parameters:
        - name: rev
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Attachment bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [attachments]
      operationId: putAttachment
      summary: Upload an attachment
      parameters:
        - name: rev
          in: query
          description: Current document revision (omit to create the document)
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Attachment stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentResult" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [attachments]
      operationId: deleteAttachment
      summary: Delete an attachment
      parameters:
        - name: rev
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Attachment deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentResult" }
        "409": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: AuthSession

  parameters:
    Db:
      name: db
      in: path
      required: true
      description: Database name
      schema:
        type: string
        pattern: "^[a-z][a-z0-9_$()+/-]*$"
    DocId:
      name: docid
      in: path
      required: true
      schema: { type: string }
    Ddoc:
      name: ddoc
      in: path
      required: true
      description: Design document name without the `_design/` prefix
      schema: { type: string }
    Partition:
      name: partition
      in: path
      required: true
      schema: { type: string }
    IfMatch:
      name: If-Match
      in: header
      description: Document revision (alternative to `rev`)
      schema: { type: string }
    Descending:
      name: descending
      in: query
      schema: { type: boolean, default: false }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 0 }
    Skip:
      name: skip
      in: query
      schema: { type: integer, minimum: 0, default: 0 }

  responses:
    Error:
      description: CouchDB error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error, reason]
      properties:
        error: { type: string }
        reason: { type: string }

    Ok:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }

    ServerInformation:
      type: object
      required: [couchdb, version]
      properties:
        couchdb: { type: string }
        version: { type: string }
        git_sha: { type: string }
        uuid: { type: string }
        features:
          type: array
          items: { type: string }
        vendor:
          type: object
          properties:
            name: { type: string }

    UpInformation:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, maintenance_mode, nolb]
        seeds:
          type: object
          additionalProperties: true

    UuidsResult:
      type: object
      required: [uuids]
      properties:
        uuids:
          type: array
          items: { type: string }

    SessionRequest:
      type: object
      required: [name, password]
      properties:
        name: { type: string }
        password: { type: string, format: password }

    SessionCreated:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        name: { type: string, nullable: true }
        roles:
          type: array
          items: { type: string }

    SessionInformation:
      type: object
      required: [ok, userCtx]
      properties:
        ok: { type: boolean }
        userCtx:
          type: object
          properties:
            name: { type: string, nullable: true }
            roles:
              type: array
              items: { type: string }
        info:
          type: object
          properties:
            authenticated: { type: string }
            authentication_db: { type: string }
            authentication_handlers:
              type: array
              items: { type: string }

    DatabaseInformation:
      type: object
      required: [db_name]
      properties:
        db_name: { type: string }
        update_seq: { type: string }
        purge_seq: { type: string }
        doc_count: { type: integer }
        doc_del_count: { type: integer }
        compact_running: { type: boolean }
        instance_start_time: { type: string }
        sizes:
          type: object
          properties:
            active: { type: integer }
            external: { type: integer }
            file: { type: integer }
        props:
          type: object
          properties:
            partitioned: { type: boolean }

    Document:
      type: object
      description: A JSON document. Arbitrary user fields are allowed.
      additionalProperties: true
      properties:
        _id: { type: string }
        _rev: { type: string }
        _deleted: { type: boolean }
        _attachments:
          type: object
          additionalProperties: true
        _conflicts:
          type: array
          items: { type: string }

    DocumentResult:
      type: object
      properties:
        id: { type: string }
        rev: { type: string }
        ok: { type: boolean }
        error: { type: string }
        reason: { type: string }

    BulkDocs:
      type: object
      required: [docs]
      properties:
        docs:
          type: array
          items: { $ref: "#/components/schemas/Document" }
        new_edits: { type: boolean, default: true }

    AllDocsQuery:
      type: object
      properties:
        include_docs: { type: boolean, default: false }
        keys:
          type: array
          items: { type: string }
        start_key: { type: string }
        end_key: { type: string }
        limit: { type: integer, minimum: 0 }
        skip: { type: integer, minimum: 0 }
        descending: { type: boolean }

    AllDocsResult:
      type: object
      required: [rows]
      properties:
        total_rows: { type: integer }
        offset: { type: integer, nullable: true }
        update_seq: { type: string }
        rows:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              key: { type: string }
              value:
                type: object
                properties:
                  rev: { type: string }
                  deleted: { type: boolean }
              doc: { $ref: "#/components/schemas/Document" }
              error: { type: string }

    FindQuery:
      type: object
      required: [selector]
      properties:
        selector:
          type: object
          additionalProperties: true
        fields:
          type: array
          items: { type: string }
        sort:
          type: array
          description: 'Field/direction pairs, e.g. `[{"age": "desc"}]`. Direction is `asc` or `desc`.'
          items:
            type: object
            additionalProperties: { type: string }
        limit: { type: integer, minimum: 0 }
        skip: { type: integer, minimum: 0 }
        use_index:
          type: array
          items: { type: string }
        bookmark: { type: string }
        execution_stats: { type: boolean }

    FindResult:
      type: object
      required: [docs]
      properties:
        docs:
          type: array
          items: { $ref: "#/components/schemas/Document" }
        bookmark: { type: string }
        warning: { type: string }
        execution_stats:
          type: object
          additionalProperties: true

    IndexDefinitionRequest:
      type: object
      required: [index]
      properties:
        index:
          type: object
          required: [fields]
          properties:
            fields:
              type: array
              items: { type: string }
            partial_filter_selector:
              type: object
              additionalProperties: true
        ddoc: { type: string }
        name: { type: string }
        type:
          type: string
          enum: [json, text]
          default: json
        partitioned: { type: boolean }

    IndexResult:
      type: object
      properties:
        result:
          type: string
          enum: [created, exists]
        id: { type: string }
        name: { type: string }

    IndexesInformation:
      type: object
      required: [indexes]
      properties:
        total_rows: { type: integer }
        indexes:
          type: array
          items:
            type: object
            properties:
              ddoc: { type: string, nullable: true }
              name: { type: string }
              type: { type: string }
              partitioned: { type: boolean }
              def:
                type: object
                additionalProperties: true

    ViewQuery:
      type: object
      properties:
        include_docs: { type: boolean, default: false }
        reduce: { type: boolean }
        group: { type: boolean }
        group_level: { type: integer, minimum: 0 }
        keys:
          type: array
          items: {}
        start_key: {}
        end_key: {}
        limit: { type: integer, minimum: 0 }
        skip: { type: integer, minimum: 0 }
        descending: { type: boolean }
        update:
          type: string
          enum: ["true", "false", lazy]

    ViewResult:
      type: object
      required: [rows]
      properties:
        total_rows: { type: integer }
        offset: { type: integer }
        rows:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              key: {}
              value: {}
              doc: { $ref: "#/components/schemas/Document" }

    ChangesResult:
      type: object
      required: [results, last_seq]
      properties:
        last_seq: { type: string }
        pending: { type: integer }
        results:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              seq: { type: string, nullable: true }
              deleted: { type: boolean }
              changes:
                type: array
                items:
                  type: object
                  properties:
                    rev: { type: string }
              doc: { $ref: "#/components/schemas/Document" }

    ChangesQuery:
      type: object
      properties:
        doc_ids:
          type: array
          items: { type: string }
        selector:
          type: object
          additionalProperties: true

    SecurityMembers:
      type: object
      properties:
        names:
          type: array
          items: { type: string }
        roles:
          type: array
          items: { type: string }

    Security:
      type: object
      properties:
        admins: { $ref: "#/components/schemas/SecurityMembers" }
        members: { $ref: "#/components/schemas/SecurityMembers" }

    DesignDocument:
      type: object
      additionalProperties: true
      properties:
        _id: { type: string }
        _rev: { type: string }
        language: { type: string, default: javascript }
        views:
          type: object
          additionalProperties:
            type: object
            properties:
              map: { type: string }
              reduce: { type: string }
        options:
          type: object
          additionalProperties: true

    ReplicationRequest:
      type: object
      required: [source, target]
      properties:
        source:
          description: Database URL, or an object with url and auth
          type: object
          additionalProperties: true
          properties:
            url: { type: string }
        target:
          type: object
          additionalProperties: true
          properties:
            url: { type: string }
        create_target: { type: boolean }
        continuous: { type: boolean }
        cancel: { type: boolean }
        doc_ids:
          type: array
          items: { type: string }
        selector:
          type: object
          additionalProperties: true

    ReplicationResult:
      type: object
      properties:
        ok: { type: boolean }
        session_id: { type: string }
        source_last_seq: { type: string }
        _local_id: { type: string }
        history:
          type: array
          items:
            type: object
            additionalProperties: true
