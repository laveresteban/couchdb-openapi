      - name: node
        in: path
        required: true
        description: Node name, usually `_local`
        schema: { type: string }
    get:
      tags: [server]
      operationId: getNodeConfig
      summary: Get the configuration of one node
      responses:
        "200":
          description: Configuration sections
          headers:
            X-Couch-Request-ID: { $ref: "#/components/headers/X-Couch-Request-ID" }
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties: { type: string }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: AuthSession

  parameters:
    Db:
      name: db
      in: path
      required: true
      description: Database name
      schema:
        type: string
        pattern: "^[a-z][a-z0-9_$()+/-]*$"
    DocId:
      name: docid
      in: path
      required: true
      schema: { type: string }
    Ddoc:
      name: ddoc
      in: path
      required: true
      description: Design document name without the `_design/` prefix
      schema: { type: string }
    Partition:
      name: partition
      in: path
      required: true
      schema: { type: string }
    IfMatch:
      name: If-Match
      in: header
      description: Document revision (alternative to `rev`)
      schema: { type: string }
    Descending:
      name: descending
      in: query
      schema: { type: boolean, default: false }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 0 }
    Skip:
      name: skip
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    IncludeDocs:
      name: include_docs
      in: query
      schema: { type: boolean, default: false }
    Key:
      name: key
      in: query
      description: JSON-encoded key to match exactly
      schema: { type: string }
    StartKey:
      name: startkey
      in: query
      description: JSON-encoded first key
      schema: { type: string }
    EndKey:
      name: endkey
      in: query
      description: JSON-encoded last key
      schema: { type: string }

  responses:
    Error:
      description: CouchDB error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  headers:
    ETag:
      description: Current revision of the document, quoted
      schema: { type: string }
    X-Couch-Request-ID:
      description: Server-generated request id, for matching server logs
      schema: { type: string }

  schemas:
    Error:
      type: object
      required: [error, reason]
      properties:
        error: { type: string }
        reason: { type: string }

    Ok:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }

    ServerInformation:
      type: object
      required: [couchdb, version]
      properties:
        couchdb: { type: string }
        version: { type: string }
        git_sha: { type: string }
        uuid: { type: string }
        features:
          type: array
          items: { type: string }
        vendor:
          type: object
          properties:
            name: { type: string }

    UpInformation:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, maintenance_mode, nolb]
        seeds:
          type: object
          additionalProperties: true

    UuidsResult:
      type: object
      required: [uuids]
      properties:
        uuids:
          type: array
          items: { type: string }

    SessionRequest:
      type: object
      required: [name, password]
      properties:
        name: { type: string }
        password: { type: string, format: password }

    SessionCreated:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        name: { type: string, nullable: true }
        roles:
          type: array
          items: { type: string }

    SessionInformation:
      type: object
      required: [ok, userCtx]
      properties:
        ok: { type: boolean }
        userCtx:
          type: object
          properties:
            name: { type: string, nullable: true }
            roles:
              type: array
              items: { type: string }
        info:
          type: object
          properties:
            authenticated: { type: string }
            authentication_db: { type: string }
            authentication_handlers:
              type: array
              items: { type: string }

    DatabaseInformation:
      type: object
      required: [db_name]
      properties:
        db_name: { type: string }
        update_seq: { type: string }
        purge_seq: { type: string }
        doc_count: { type: integer }
        doc_del_count: { type: integer }
        compact_running: { type: boolean }
        instance_start_time: { type: string }
        sizes:
          type: object
          properties:
            active: { type: integer }
            external: { type: integer }
            file: { type: integer }
        props:
          type: object
          properties:
            partitioned: { type: boolean }

    Document:
      type: object
      description: A JSON document. Arbitrary user fields are allowed.
      additionalProperties: true
      properties:
        _id: { type: string }
        _rev: { type: string }
        _deleted: { type: boolean }
        _attachments:
          type: object
          additionalProperties: true
        _conflicts:
          type: array
          items: { type: string }
        _revisions:
          type: object
          properties:
            start: { type: integer }
            ids:
              type: array
              items: { type: string }

    DocumentResult:
      type: object
      properties:
        id: { type: string }
        rev: { type: string }
        ok: { type: boolean }
        error: { type: string }
        reason: { type: string }

    BulkDocs:
      type: object
      required: [docs]
      properties:
        docs:
          type: array
          items: { $ref: "#/components/schemas/Document" }
        new_edits: { type: boolean, default: true }

    AllDocsQuery:
      type: object
      properties:
        include_docs: { type: boolean, default: false }
        keys:
          type: array
          items: { type: string }
        start_key: { type: string }
        end_key: { type: string }
        limit: { type: integer, minimum: 0 }
        skip: { type: integer, minimum: 0 }
        descending: { type: boolean }

    AllDocsResult:
      type: object
      required: [rows]
      properties:
        total_rows: { type: integer }
        offset: { type: integer, nullable: true }
        update_seq: { type: string }
        rows:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              key: { type: string }
              value:
                type: object
                properties:
                  rev: { type: string }
                  deleted: { type: boolean }
              doc: { $ref: "#/components/schemas/Document" }
              error: { type: string }

    FindQuery:
      type: object
      required: [selector]
      properties:
        selector:
          type: object
          additionalProperties: true
        fields:
          type: array
          items: { type: string }
        sort:
          type: array
          description: 'Field/direction pairs, e.g. `[{"age": "desc"}]`. Direction is `asc` or `desc`.'
          items:
            type: object
            additionalProperties: { type: string }
        limit: { type: integer, minimum: 0 }
        skip: { type: integer, minimum: 0 }
        use_index:
          type: array
          items: { type: string }
        bookmark: { type: string }
        execution_stats: { type: boolean }

    FindResult:
      type: object
      required: [docs]
      properties:
        docs:
          type: array
          items: { $ref: "#/components/schemas/Document" }
        bookmark: { type: string }
        warning: { type: string }
        execution_stats:
          type: object
          additionalProperties: true

    IndexDefinitionRequest:
      type: object
      required: [index]
      properties:
        index:
          type: object
          required: [fields]
          properties:
            fields:
              type: array
              items: { type: string }
            partial_filter_selector:
              type: object
              additionalProperties: true
        ddoc: { type: string }
        name: { type: string }
        type:
          type: string
          enum: [json, text]
          default: json
        partitioned: { type: boolean }

    IndexResult:
      type: object
      properties:
        result:
          type: string
          enum: [created, exists]
        id: { type: string }
        name: { type: string }

    IndexesInformation:
      type: object
      required: [indexes]
      properties:
        total_rows: { type: integer }
        indexes:
          type: array
          items:
            type: object
            properties:
              ddoc: { type: string, nullable: true }
              name: { type: string }
              type: { type: string }
              partitioned: { type: boolean }
              def:
                type: object
                additionalProperties: true

    ViewQuery:
      type: object
      properties:
        include_docs: { type: boolean, default: false }
        reduce: { type: boolean }
        group: { type: boolean }
        group_level: { type: integer, minimum: 0 }
        keys:
          type: array
          items: {}
        start_key: {}
        end_key: {}
        limit: { type: integer, minimum: 0 }
        skip: { type: integer, minimum: 0 }
        descending: { type: boolean }
        update:
          type: string
          enum: ["true", "false", lazy]

    ViewResult:
      type: object
      required: [rows]
      properties:
        total_rows: { type: integer }
        offset: { type: integer }
        rows:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              key: {}
              value: {}
              doc: { $ref: "#/components/schemas/Document" }

    ChangesResult:
      type: object
      required: [results, last_seq]
      properties:
        last_seq: { type: string }
        pending: { type: integer }
        results:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              seq: { type: string, nullable: true }
              deleted: { type: boolean }
              changes:
                type: array
                items:
                  type: object
                  properties:
                    rev: { type: string }
              doc: { $ref: "#/components/schemas/Document" }

    ChangesQuery:
      type: object
      properties:
        doc_ids:
          type: array
          items: { type: string }
        selector:
          type: object
          additionalProperties: true

    SecurityMembers:
      type: object
      properties:
        names:
          type: array
          items: { type: string }
        roles:
          type: array
          items: { type: string }

    Security:
      type: object
      properties:
        admins: { $ref: "#/components/schemas/SecurityMembers" }
        members: { $ref: "#/components/schemas/SecurityMembers" }

    DesignDocument:
      type: object
      additionalProperties: true
      properties:
        _id: { type: string }
        _rev: { type: string }
        language: { type: string, default: javascript }
        views:
          type: object
          additionalProperties:
            type: object
            properties:
              map: { type: string }
              reduce: { type: string }
        options:
          type: object
          additionalProperties: true

    ReplicationRequest:
      type: object
      required: [source, target]
      properties:
        source:
          description: Database URL, or an endpoint object with url and auth
          oneOf:
            - { type: string }
            - { $ref: "#/components/schemas/ReplicationEndpoint" }
        target:
          description: Database URL, or an endpoint object with url and auth
          oneOf:
            - { type: string }
            - { $ref: "#/components/schemas/ReplicationEndpoint" }
        create_target: { type: boolean }
        continuous: { type: boolean }
        cancel: { type: boolean }
        doc_ids:
          type: array
          items: { type: string }
        selector:
          type: object
          additionalProperties: true

    ReplicationResult:
      type: object
      properties:
        ok: { type: boolean }
        session_id: { type: string }
        source_last_seq: { type: string }
        _local_id: { type: string }
        history:
          type: array
          items:
            type: object
            additionalProperties: true

    ReplicationEndpoint:
      type: object
      additionalProperties: true
      properties:
        url: { type: string }
        auth:
          type: object
          additionalProperties: true
        headers:
          type: object
          additionalProperties: { type: string }

    BulkGetQuery:
      type: object
      required: [docs]
      properties:
        docs:
          type: array
          items:
            type: object
            required: [id]
            properties:
              id: { type: string }
              rev: { type: string }
              atts_since:
                type: array
                items: { type: string }

    BulkGetResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              docs:
                type: array
                items:
                  type: object
                  properties:
                    ok: { $ref: "#/components/schemas/Document" }
                    error:
                      type: object
                      properties:
                        id: { type: string }
                        rev: { type: string }
                        error: { type: string }
                        reason: { type: string }

    RevsDiffRequest:
      type: object
      description: Map of document id to the revisions to check
      additionalProperties:
        type: array
        items: { type: string }

    RevsDiffResult:
      type: object
      description: Map of document id to the revisions the database is missing
      additionalProperties:
        type: object
        properties:
          missing:
            type: array
            items: { type: string }
          possible_ancestors:
            type: array
            items: { type: string }

    Explain:
      type: object
      additionalProperties: true
      properties:
        dbname: { type: string }
        index: { type: object, additionalProperties: true }
        selector: { type: object, additionalProperties: true }
        opts: { type: object, additionalProperties: true }
        limit: { type: integer }
        skip: { type: integer }
        fields:
          type: array
          items: { type: string }
        range: { type: object, additionalProperties: true }

    PurgeRequest:
      type: object
      description: Map of document id to the revisions to purge
      additionalProperties:
        type: array
        items: { type: string }

    PurgeResult:
      type: object
      properties:
        purge_seq: { type: string, nullable: true }
        purged:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

    DbsInfoRequest:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items: { type: string }

    DbsInfoResult:
      type: object
      properties:
        key: { type: string }
        info: { $ref: "#/components/schemas/DatabaseInformation" }
        error: { type: string }

    ActiveTask:
      type: object
      additionalProperties: true
      properties:
        type: { type: string }
        pid: { type: string }
        database: { type: string }
        node: { type: string }
        started_on: { type: integer }
        updated_on: { type: integer }
        progress: { type: integer }

    SchedulerJobs:
      type: object
      properties:
        total_rows: { type: integer }
        offset: { type: integer }
        jobs:
          type: array
          items: { type: object, additionalProperties: true }

    SchedulerDocs:
      type: object
      properties:
        total_rows: { type: integer }
        offset: { type: integer }
        docs:
          type: array
          items: { type: object, additionalProperties: true }
