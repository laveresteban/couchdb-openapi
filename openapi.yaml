openapi: 3.0.3
info:
  title: Apache CouchDB API
  description: |
    OpenAPI description of the Apache CouchDB 3.x HTTP API.
    This is the single source of truth for all generated CouchDB SDKs.
  version: 0.5.0
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
externalDocs:
  url: https://docs.couchdb.org/en/stable/api/index.html
servers:
  - url: http://localhost:5984
    description: Local CouchDB
security:
  - basicAuth: []
  - cookieAuth: []
tags:
  - name: server
    description: Server-level information and utilities
  - name: authentication
    description: Cookie session authentication
  - name: databases
    description: Create, inspect and delete databases
  - name: documents
    description: Read and write JSON documents
  - name: design-documents
    description: Design documents and MapReduce views
  - name: query
    description: All-docs and Mango queries and indexes
  - name: changes
    description: Database changes feed
  - name: attachments
    description: Binary attachments on documents
  - name: replication
    description: One-off and continuous replication
  - name: security
    description: Per-database admins and members
  - name: partitions
    description: Queries scoped to a partition of a partitioned database

paths:
  /:
    get:
      tags: [server]
      operationId: getServerInformation
      summary: Server meta information
      security: []
      responses:
        "200":
          description: Server information
          headers:
            X-Couch-Request-ID: { $ref: "#/components/headers/X-Couch-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerInformation" }
        "400": { $ref: "#/components/responses/Error" }

  /_up:
    get:
      tags: [server]
      operationId: getUp
      summary: Health check
      security: []
      responses:
        "200":
          description: Server is up
          headers:
            X-Couch-Request-ID: { $ref: "#/components/headers/X-Couch-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpInformation" }
        "404":
          $ref: "#/components/responses/Error"

  /_all_dbs:
    get:
      tags: [server]
      operationId: getAllDbs
      summary: List all databases
      parameters:
        - { $ref: "#/components/parameters/Descending" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Skip" }
      responses:
        "200":
          description: Database names
          headers:
            X-Couch-Request-ID: { $ref: "#/components/headers/X-Couch-Request-ID" }
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /_uuids:
    get:
      tags: [server]
      operationId: getUuids
      summary: Request server-generated UUIDs
      parameters:
        - name: count
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        "200":
          description: UUIDs
          headers:
            X-Couch-Request-ID: { $ref: "#/components/headers/X-Couch-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UuidsResult" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }

  /_session:
    get:
      tags: [authentication]
      operationId: getSession
      summary: Get current session information
      responses:
        "200":
          description: Session info
          headers:
            X-Couch-Request-ID: { $ref: "#/components/headers/X-Couch-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInformation" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [authentication]
      operationId: postSession
      summary: Start a cookie session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionRequest" }
      responses:
        "200":
          description: Session created; AuthSession cookie is set
          headers:
            X-Couch-Request-ID: { $ref: "#/components/headers/X-Couch-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionCreated" }
        "401":
          $ref: "#/components/responses/Error"
        "400": { $ref: "#/components/responses/Error" }
    delete:
      tags: [authentication]
      operationId: deleteSession
      summary: End the cookie session
      responses:
        "200":
          description: Session ended
          headers:
            X-Couch-Request-ID: { $ref: "#/components/headers/X-Couch-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /{db}:
    parameters:
      - { $ref: "#/components/parameters/Db" }
    head:
      tags: [databases]
      operationId: headDatabase
      summary: Check database existence
      responses:
        "200": { description: Database exists }
        "404": { description: Database does not exist }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    get:
      tags: [databases]
      operationId: getDatabaseInformation
      summary: Get database information
      responses:
        "200":
          description: Database information
          headers:
            X-Couch-Request-ID: { $ref: "#/components/headers/X-Couch-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatabaseInformation" }
        "404":
          $ref: "#/components/responses/Error"
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    put:
      tags: [databases]
      operationId: putDatabase
      summary: Create a database
      parameters:
        - name: q
          in: query
          description: Number of shards
          schema: { type: integer, minimum: 1 }
        - name: n
          in: query
          description: Number of replicas
          schema: { type: integer, minimum: 1 }
        - name: partitioned
          in: query
          schema: { type: boolean, default: false }
      responses:
        "201":
          description: Database created
          headers:
            X-Couch-Request-ID: { $ref: "#/components/headers/X-Couch-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "202":
          description: Database created, quorum not met
          headers:
            X-Couch-Request-ID: { $ref: "#/components/headers/X-Couch-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    delete:
      tags: [databases]
      operationId: deleteDatabase
      summary: Delete a database
      responses:
        "200":
          description: Database deleted
          headers:
            X-Couch-Request-ID: { $ref: "#/components/headers/X-Couch-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "202":
          description: Database deleted, quorum not met
          headers:
            X-Couch-Request-ID: { $ref: "#/components/headers/X-Couch-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "404": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [documents]
      operationId: postDocument
      summary: Create a document with a server-generated id
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Document" }
      responses:
        "201":
          description: Document created
          headers:
            X-Couch-Request-ID: { $ref: "#/components/headers/X-Couch-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentResult" }
        "202":
          description: Document accepted
          headers:
            X-Couch-Request-ID: { $ref: "#/components/headers/X-Couch-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentResult" }
        "409": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }

  /{db}/_all_docs:
    parameters:
      - { $ref: "#/components/parameters/Db" }
    get:
      tags: [query]
      operationId: getAllDocs
      summary: Query all documents (GET form; keys are JSON-encoded)
      parameters:
        - { $ref: "#/components/parameters/IncludeDocs" }
        - { $ref: "#/components/parameters/Descending" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Skip" }
        - { $ref: "#/components/parameters/Key" }
        - { $ref: "#/components/parameters/StartKey" }
        - { $ref: "#/components/parameters/EndKey" }
      responses:
        "200":
          description: Rows
          headers:
            X-Couch-Request-ID: { $ref: "#/components/headers/X-Couch-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AllDocsResult" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [query]
      operationId: postAllDocs
      summary: Query all documents
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AllDocsQuery" }
      responses:
        "200":
          description: Rows
          headers:
            X-Couch-Request-ID: { $ref: "#/components/headers/X-Couch-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AllDocsResult" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }

  /{db}/_bulk_docs:
    parameters:
      - { $ref: "#/components/parameters/Db" }
    post:
      tags: [documents]
      operationId: postBulkDocs
      summary: Create, update or delete documents in bulk
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkDocs" }
      responses:
        "202":
          description: Accepted; some writes did not reach quorum
          headers:
            X-Couch-Request-ID: { $ref: "#/components/headers/X-Couch-Request-ID" }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DocumentResult" }
        "201":
          description: Per-document results
          headers:
            X-Couch-Request-ID: { $ref: "#/components/headers/X-Couch-Request-ID" }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DocumentResult" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }

  /{db}/_find:
    parameters:
      - { $ref: "#/components/parameters/Db" }
    post:
      tags: [query]
      operationId: postFind
      summary: Mango query
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FindQuery" }
      responses:
        "200":
          description: Matching documents
          headers:
            X-Couch-Request-ID: { $ref: "#/components/headers/X-Couch-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FindResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /{db}/_index:
    parameters:
      - { $ref: "#/components/parameters/Db" }
    get:
      tags: [query]
      operationId: getIndexes
      summary: List Mango indexes
      responses:
        "200":
          description: Indexes
          headers:
            X-Couch-Request-ID: { $ref: "#/components/headers/X-Couch-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IndexesInformation" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [query]
      operationId: postIndex
      summary: Create a Mango index
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IndexDefinitionRequest" }
      responses:
        "200":
          description: Index created or already exists
          headers:
            X-Couch-Request-ID: { $ref: "#/components/headers/X-Couch-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IndexResult" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }

  /{db}/{docid}:
    parameters:
      - { $ref: "#/components/parameters/Db" }
      - { $ref: "#/components/parameters/DocId" }
    get:
      tags: [documents]
      operationId: getDocument
      summary: Get a document
      parameters:
        - name: rev
          in: query
          schema: { type: string }
        - name: revs_info
          in: query
          schema: { type: boolean, default: false }
        - name: conflicts
          in: query
          schema: { type: boolean, default: false }
        - name: open_revs
          in: query
          description: "`all` or a JSON array of revisions. The response is then a list of `{ok: Document}` or `{missing: rev}` entries, which the 200 schema does not model."
          schema: { type: string }
        - name: revs
          in: query
          description: Include the revision history in `_revisions`.
          schema: { type: boolean, default: false }
        - name: attachments
          in: query
          description: Inline attachment bodies, base64-encoded, in `_attachments`.
          schema: { type: boolean, default: false }
        - name: latest
          in: query
          description: With `open_revs`, return the latest leaf revisions.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: The document
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            X-Couch-Request-ID: { $ref: "#/components/headers/X-Couch-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "404": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
    head:
      tags: [documents]
      operationId: headDocument
      summary: Get a document's current revision without its body
      parameters:
        - name: rev
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Document exists; the ETag header carries its revision
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            X-Couch-Request-ID: { $ref: "#/components/headers/X-Couch-Request-ID" }
        "404": { description: Document does not exist }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
    put:
      tags: [documents]
      operationId: putDocument
      summary: Create or update a document
      parameters:
        - { $ref: "#/components/parameters/IfMatch" }
        - name: rev
          in: query
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Document" }
      responses:
        "201":
          description: Document written
          headers:
            X-Couch-Request-ID: { $ref: "#/components/headers/X-Couch-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentResult" }
        "202":
          description: Document accepted
          headers:
            X-Couch-Request-ID: { $ref: "#/components/headers/X-Couch-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentResult" }
        "409": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
    delete:
      tags: [documents]
      operationId: deleteDocument
      summary: Delete a document
      parameters:
        - { $ref: "#/components/parameters/IfMatch" }
        - name: rev
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Document deleted
          headers:
            X-Couch-Request-ID: { $ref: "#/components/headers/X-Couch-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentResult" }
        "202":
          description: Deletion accepted
          headers:
            X-Couch-Request-ID: { $ref: "#/components/headers/X-Couch-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentResult" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }

  /{db}/_design/{ddoc}/_view/{view}:
    parameters:
      - { $ref: "#/components/parameters/Db" }
      - { $ref: "#/components/parameters/Ddoc" }
      - name: view
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [design-documents]
      operationId: postView
      summary: Query a MapReduce view
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ViewQuery" }
      responses:
        "200":
          description: View rows
          headers:
            X-Couch-Request-ID: { $ref: "#/components/headers/X-Couch-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ViewResult" }
        "404": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }

  /_replicate:
    post:
      tags: [replication]
      operationId: postReplicate
      summary: Run or cancel a one-off replication
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplicationRequest" }
      responses:
        "200":
          description: Replication finished
          headers:
            X-Couch-Request-ID: { $ref: "#/components/headers/X-Couch-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReplicationResult" }
        "202":
          description: Continuous replication started
          headers:
            X-Couch-Request-ID: { $ref: "#/components/headers/X-Couch-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReplicationResult" }
        "404": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }

  /{db}/_changes:
    parameters:
      - { $ref: "#/components/parameters/Db" }
      - name: feed
        in: query
        description: "`normal`/`longpoll` return one JSON object; `continuous` streams newline-delimited change objects. `eventsource` is not supported."
        schema: { type: string, enum: [normal, longpoll, continuous], default: normal }
      - name: since
        in: query
        description: Start after this sequence; `now` skips existing changes.
        schema: { type: string, default: "0" }
      - name: include_docs
        in: query
        schema: { type: boolean, default: false }
      - name: conflicts
        in: query
        description: Include `_conflicts` in docs; requires `include_docs`.
        schema: { type: boolean, default: false }
      - name: attachments
        in: query
        schema: { type: boolean, default: false }
      - name: style
        in: query
        description: "`all_docs` returns all leaf revisions, not just the winner."
        schema: { type: string, enum: [main_only, all_docs], default: main_only }
      - name: filter
        in: query
        description: "`_doc_ids`, `_selector`, `_design`, `_view` or `ddoc/filter`."
        schema: { type: string }
      - name: view
        in: query
        description: "`ddoc/view` used with `filter=_view`."
        schema: { type: string }
      - name: doc_ids
        in: query
        description: JSON array of ids, used with `filter=_doc_ids`.
        schema: { type: string }
      - { $ref: "#/components/parameters/Limit" }
      - name: timeout
        in: query
        description: Longpoll timeout in milliseconds
        schema: { type: integer, minimum: 0 }
      - name: heartbeat
        in: query
        description: Milliseconds between keep-alive newlines.
        schema: { type: integer, minimum: 0 }
      - name: seq_interval
        in: query
        description: Only compute `seq` every N rows; others are null. Faster on clusters.
        schema: { type: integer, minimum: 1 }
      - { $ref: "#/components/parameters/Descending" }
    get:
      tags: [changes]
      operationId: getChanges
      summary: Database changes feed (normal, longpoll or continuous)
      responses:
        "200":
          description: Changes
          headers:
            X-Couch-Request-ID: { $ref: "#/components/headers/X-Couch-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangesResult" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [changes]
      operationId: postChanges
      summary: Changes feed filtered by a body (`_doc_ids` or `_selector`)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangesQuery" }
      responses:
        "200":
          description: Changes
          headers:
            X-Couch-Request-ID: { $ref: "#/components/headers/X-Couch-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangesResult" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /{db}/_local/{docid}:
    parameters:
      - { $ref: "#/components/parameters/Db" }
      - { $ref: "#/components/parameters/DocId" }
    get:
      tags: [documents]
      operationId: getLocalDocument
      summary: Get a local (non-replicated) document
      responses:
        "200":
          description: The document
          headers:
            X-Couch-Request-ID: { $ref: "#/components/headers/X-Couch-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "404": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    put:
      tags: [documents]
      operationId: putLocalDocument
      summary: Create or update a local document
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Document" }
      responses:
        "201":
          description: Document written
          headers:
            X-Couch-Request-ID: { $ref: "#/components/headers/X-Couch-Request-ID" }
          content:
            application/json:
