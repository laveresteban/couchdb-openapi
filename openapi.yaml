openapi: 3.0.3
info:
  title: Apache CouchDB API
  description: |
    OpenAPI description of the Apache CouchDB 3.x HTTP API.
    This is the single source of truth for all generated CouchDB SDKs.
  version: 0.7.0
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
externalDocs:
  url: https://docs.couchdb.org/en/stable/api/index.html
servers:
  - url: http://localhost:5984
    description: Local CouchDB
security:
  - basicAuth: []
  - cookieAuth: []
  - bearerAuth: []
tags:
  - name: server
    description: Server-level information and utilities
  - name: authentication
    description: Cookie session authentication
  - name: databases
    description: Create, inspect and delete databases
  - name: documents
    description: Read and write JSON documents
  - name: design-documents
    description: Design documents and MapReduce views
  - name: query
    description: All-docs and Mango queries and indexes
  - name: changes
    description: Database changes feed
  - name: attachments
    description: Binary attachments on documents
  - name: replication
    description: One-off and continuous replication
  - name: security
    description: Per-database admins and members
  - name: partitions
    description: Queries scoped to a partition of a partitioned database
  - name: maintenance
    description: Compaction, purging, query plans and server tasks

paths:
  /:
    get:
      tags: [server]
      operationId: getServerInformation
      summary: Server meta information
      security: []
      responses:
        "200":
          description: Server information
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerInformation" }

  /_up:
    get:
      tags: [server]
      operationId: getUp
      summary: Health check
      security: []
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpInformation" }
        "404":
          $ref: "#/components/responses/Error"

  /_all_dbs:
    get:
      tags: [server]
      operationId: getAllDbs
      summary: List all databases
      parameters:
        - { $ref: "#/components/parameters/Descending" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Skip" }
      responses:
        "200":
          description: Database names
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
        "401": { $ref: "#/components/responses/Error" }

  /_uuids:
    get:
      tags: [server]
      operationId: getUuids
      summary: Request server-generated UUIDs
      parameters:
        - name: count
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        "200":
          description: UUIDs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UuidsResult" }
        "401": { $ref: "#/components/responses/Error" }

  /_session:
    get:
      tags: [authentication]
      operationId: getSession
      summary: Get current session information
      responses:
        "200":
          description: Session info
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInformation" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      tags: [authentication]
      operationId: postSession
      summary: Start a cookie session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionRequest" }
      responses:
        "200":
          description: Session created; AuthSession cookie is set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionCreated" }
        "401":
          $ref: "#/components/responses/Error"
    delete:
      tags: [authentication]
      operationId: deleteSession
      summary: End the cookie session
      responses:
        "200":
          description: Session ended
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "401": { $ref: "#/components/responses/Error" }

  /{db}:
    parameters:
      - { $ref: "#/components/parameters/Db" }
    head:
      tags: [databases]
      operationId: headDatabase
      summary: Check database existence
      responses:
        "200": { description: Database exists }
        "404": { description: Database does not exist }
    get:
      tags: [databases]
      operationId: getDatabaseInformation
      summary: Get database information
      responses:
        "200":
          description: Database information
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatabaseInformation" }
        "404":
          $ref: "#/components/responses/Error"
    put:
      tags: [databases]
      operationId: putDatabase
      summary: Create a database
      parameters:
        - name: q
          in: query
          description: Number of shards
          schema: { type: integer, minimum: 1 }
        - name: n
          in: query
          description: Number of replicas
          schema: { type: integer, minimum: 1 }
        - name: partitioned
          in: query
          schema: { type: boolean, default: false }
      responses:
        "201":
          description: Database created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "202":
          description: Database created, quorum not met
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    delete:
      tags: [databases]
      operationId: deleteDatabase
      summary: Delete a database
      responses:
        "200":
          description: Database deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "202":
          description: Database deleted, quorum not met
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "404": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [documents]
      operationId: postDocument
      summary: Create a document with a server-generated id
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Document" }
      responses:
        "201":
          description: Document created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentResult" }
        "202":
          description: Document accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentResult" }
        "409": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /{db}/_all_docs:
    parameters:
      - { $ref: "#/components/parameters/Db" }
    get:
      tags: [query]
      operationId: getAllDocs
      summary: Query all documents (key range in the query string)
      parameters:
        - { $ref: "#/components/parameters/IncludeDocs" }
        - { $ref: "#/components/parameters/JsonKey" }
        - { $ref: "#/components/parameters/JsonKeys" }
        - { $ref: "#/components/parameters/JsonStartKey" }
        - { $ref: "#/components/parameters/JsonEndKey" }
        - { $ref: "#/components/parameters/InclusiveEnd" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Skip" }
        - { $ref: "#/components/parameters/Descending" }
        - name: conflicts
          in: query
          schema: { type: boolean, default: false }
        - name: update_seq
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Rows
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AllDocsResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [query]
      operationId: postAllDocs
      summary: Query all documents
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AllDocsQuery" }
      responses:
        "200":
          description: Rows
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AllDocsResult" }
        "401": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /{db}/_bulk_docs:
    parameters:
      - { $ref: "#/components/parameters/Db" }
    post:
      tags: [documents]
      operationId: postBulkDocs
      summary: Create, update or delete documents in bulk
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkDocs" }
      responses:
        "201":
          description: Per-document results
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DocumentResult" }
        "401": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "417": { $ref: "#/components/responses/Error" }

  /{db}/_find:
    parameters:
      - { $ref: "#/components/parameters/Db" }
    post:
      tags: [query]
      operationId: postFind
      summary: Mango query
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FindQuery" }
      responses:
        "200":
          description: Matching documents
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FindResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /{db}/_index:
    parameters:
      - { $ref: "#/components/parameters/Db" }
    get:
      tags: [query]
      operationId: getIndexes
      summary: List Mango indexes
      responses:
        "200":
          description: Indexes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IndexesInformation" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      tags: [query]
      operationId: postIndex
      summary: Create a Mango index
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IndexDefinitionRequest" }
      responses:
        "200":
          description: Index created or already exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IndexResult" }
        "401": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /{db}/{docid}:
    parameters:
      - { $ref: "#/components/parameters/Db" }
      - { $ref: "#/components/parameters/DocId" }
    get:
      tags: [documents]
      operationId: getDocument
      summary: Get a document
      parameters:
        - name: rev
          in: query
          schema: { type: string }
        - name: revs_info
          in: query
          schema: { type: boolean, default: false }
        - name: conflicts
          in: query
          schema: { type: boolean, default: false }
        - name: revs
          in: query
          description: Include the revision history as `_revisions`
          schema: { type: boolean, default: false }
        - name: latest
          in: query
          description: With `rev`, return the latest leaf revision on that branch
          schema: { type: boolean, default: false }
        - { $ref: "#/components/parameters/IfNoneMatch" }
      responses:
        "200":
          description: The document
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "304": { description: Not modified since the `If-None-Match` ETag }
        "404": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    head:
      tags: [documents]
      operationId: headDocument
      summary: Check that a document exists and get its current revision
      description: The `ETag` header holds the winning revision, quoted.
      parameters:
        - { $ref: "#/components/parameters/IfNoneMatch" }
      responses:
        "200":
          description: Document exists
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
        "304": { description: Not modified since the `If-None-Match` ETag }
        "401": { description: Authentication required }
        "403": { description: Not allowed }
        "404": { description: Document does not exist }
    put:
      tags: [documents]
      operationId: putDocument
      summary: Create or update a document
      parameters:
        - { $ref: "#/components/parameters/IfMatch" }
        - name: rev
          in: query
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Document" }
      responses:
        "201":
          description: Document written
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentResult" }
        "202":
          description: Document accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentResult" }
        "409": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    delete:
      tags: [documents]
      operationId: deleteDocument
      summary: Delete a document
      parameters:
        - { $ref: "#/components/parameters/IfMatch" }
        - name: rev
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Document deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentResult" }
        "202":
          description: Deletion accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentResult" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /{db}/_design/{ddoc}/_view/{view}:
    parameters:
      - { $ref: "#/components/parameters/Db" }
      - { $ref: "#/components/parameters/Ddoc" }
      - name: view
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [design-documents]
      operationId: getView
      summary: Query a MapReduce view (keys in the query string)
      parameters:
        - { $ref: "#/components/parameters/IncludeDocs" }
        - { $ref: "#/components/parameters/JsonKey" }
        - { $ref: "#/components/parameters/JsonKeys" }
        - { $ref: "#/components/parameters/JsonStartKey" }
        - { $ref: "#/components/parameters/JsonEndKey" }
        - { $ref: "#/components/parameters/InclusiveEnd" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Skip" }
        - { $ref: "#/components/parameters/Descending" }
        - name: reduce
          in: query
          schema: { type: boolean }
        - name: group
          in: query
          schema: { type: boolean }
        - name: group_level
          in: query
          schema: { type: integer, minimum: 0 }
        - name: update
          in: query
          schema: { type: string, enum: ["true", "false", lazy] }
        - name: stable
          in: query
          schema: { type: boolean }
        - name: update_seq
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: View rows
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ViewResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [design-documents]
      operationId: postView
      summary: Query a MapReduce view
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ViewQuery" }
      responses:
        "200":
          description: View rows
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ViewResult" }
        "404": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /_replicate:
    post:
      tags: [replication]
      operationId: postReplicate
      summary: Run or cancel a one-off replication
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplicationRequest" }
      responses:
        "200":
          description: Replication finished
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReplicationResult" }
        "202":
          description: Continuous replication started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReplicationResult" }
        "404": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /{db}/_changes:
    parameters:
      - { $ref: "#/components/parameters/Db" }
      - name: feed
        in: query
        description: "`normal`/`longpoll` return one JSON object; `continuous` streams newline-delimited change objects. `eventsource` is not supported."
        schema: { type: string, enum: [normal, longpoll, continuous], default: normal }
      - name: since
        in: query
        description: Start after this sequence; `now` skips existing changes.
        schema: { type: string, default: "0" }
      - name: include_docs
        in: query
        schema: { type: boolean, default: false }
      - name: conflicts
        in: query
        description: Include `_conflicts` in docs; requires `include_docs`.
        schema: { type: boolean, default: false }
      - name: attachments
        in: query
        schema: { type: boolean, default: false }
      - name: style
        in: query
        description: "`all_docs` returns all leaf revisions, not just the winner."
        schema: { type: string, enum: [main_only, all_docs], default: main_only }
      - name: filter
        in: query
        description: "`_doc_ids`, `_selector`, `_design`, `_view` or `ddoc/filter`."
        schema: { type: string }
      - name: view
        in: query
        description: "`ddoc/view` used with `filter=_view`."
        schema: { type: string }
      - name: doc_ids
        in: query
        description: JSON array of ids, used with `filter=_doc_ids`.
        schema: { type: string }
      - { $ref: "#/components/parameters/Limit" }
      - name: timeout
        in: query
        description: Longpoll timeout in milliseconds
        schema: { type: integer, minimum: 0 }
      - name: heartbeat
        in: query
        description: Milliseconds between keep-alive newlines.
        schema: { type: integer, minimum: 0 }
      - name: seq_interval
        in: query
        description: Only compute `seq` every N rows; others are null. Faster on clusters.
        schema: { type: integer, minimum: 1 }
      - { $ref: "#/components/parameters/Descending" }
    get:
      tags: [changes]
      operationId: getChanges
      summary: Database changes feed (normal, longpoll or continuous)
      responses:
        "200":
          description: |
            Changes. With `feed=continuous` the body is newline-delimited JSON
            instead of one object: a change per line, blank heartbeat lines,
            then a final `{"last_seq": ...}` line. Generated clients can't
            stream that; read the raw response.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangesResult" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [changes]
      operationId: postChanges
      summary: Changes feed filtered by a body (`_doc_ids` or `_selector`)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangesQuery" }
      responses:
        "200":
          description: Changes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangesResult" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /{db}/_local/{docid}:
    parameters:
      - { $ref: "#/components/parameters/Db" }
      - { $ref: "#/components/parameters/DocId" }
    get:
      tags: [documents]
      operationId: getLocalDocument
      summary: Get a local (non-replicated) document
      responses:
        "200":
          description: The document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "404": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    put:
      tags: [documents]
      operationId: putLocalDocument
      summary: Create or update a local document
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Document" }
      responses:
        "201":
          description: Document written
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentResult" }
        "409": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    delete:
      tags: [documents]
      operationId: deleteLocalDocument
      summary: Delete a local document
      parameters:
        - name: rev
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Document deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentResult" }
        "404": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /{db}/_revs_diff:
    parameters:
      - { $ref: "#/components/parameters/Db" }
    post:
      tags: [replication]
      operationId: postRevsDiff
      summary: Find which revisions the database does not have
      description: Used by replicators to skip revisions the target already stores.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RevsDiffRequest" }
      responses:
        "200":
          description: Missing revisions, keyed by document id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevsDiffResult" }
        "401": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /{db}/_bulk_get:
    parameters:
      - { $ref: "#/components/parameters/Db" }
    post:
      tags: [replication]
      operationId: postBulkGet
      summary: Fetch many documents and revisions in one request
      parameters:
        - name: revs
          in: query
          description: Include `_revisions` in each returned document
          schema: { type: boolean, default: false }
        - name: latest
          in: query
          schema: { type: boolean, default: false }
        - name: attachments
          in: query
          description: Include attachment content as base64 `data`. With `atts_since`, only attachments newer than those revisions are sent; the rest come back as stubs.
          schema: { type: boolean, default: false }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkGetRequest" }
      responses:
        "200":
          description: One result per requested document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkGetResult" }
        "401": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /{db}/_security:
    parameters:
      - { $ref: "#/components/parameters/Db" }
    get:
      tags: [security]
      operationId: getSecurity
      summary: Get the database security object
      responses:
        "200":
          description: Security object
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Security" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    put:
      tags: [security]
      operationId: putSecurity
      summary: Replace the database security object
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Security" }
      responses:
        "200":
          description: Security updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "401": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /{db}/_design/{ddoc}:
    parameters:
      - { $ref: "#/components/parameters/Db" }
      - { $ref: "#/components/parameters/Ddoc" }
    get:
      tags: [design-documents]
      operationId: getDesignDocument
      summary: Get a design document
      responses:
        "200":
          description: The design document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DesignDocument" }
        "404": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    put:
      tags: [design-documents]
      operationId: putDesignDocument
      summary: Create or update a design document
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DesignDocument" }
      responses:
        "201":
          description: Written
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentResult" }
        "409": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    delete:
      tags: [design-documents]
      operationId: deleteDesignDocument
      summary: Delete a design document
      parameters:
        - name: rev
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentResult" }
        "404": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /{db}/_partition/{partition}/_all_docs:
    parameters:
      - { $ref: "#/components/parameters/Db" }
      - { $ref: "#/components/parameters/Partition" }
    post:
      tags: [partitions]
      operationId: postPartitionAllDocs
      summary: Query all documents in one partition
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AllDocsQuery" }
      responses:
        "200":
          description: Rows
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AllDocsResult" }
        "401": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /{db}/_partition/{partition}/_find:
    parameters:
      - { $ref: "#/components/parameters/Db" }
      - { $ref: "#/components/parameters/Partition" }
    post:
      tags: [partitions]
      operationId: postPartitionFind
      summary: Mango query within one partition
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FindQuery" }
      responses:
        "200":
          description: Matching documents
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FindResult" }
        "401": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /{db}/{docid}/{attname}:
    parameters:
      - { $ref: "#/components/parameters/Db" }
      - { $ref: "#/components/parameters/AttDocId" }
      - name: attname
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [attachments]
      operationId: getAttachment
      summary: Download an attachment
      description: The response `Content-Type` is the attachment's own content type.
      parameters:
        - name: rev
          in: query
          schema: { type: string }
        - { $ref: "#/components/parameters/IfNoneMatch" }
      responses:
        "200":
          description: Attachment bytes
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
            "*/*":
              schema: { type: string, format: binary }
        "304": { description: Not modified since the `If-None-Match` ETag }
        "404": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    put:
      tags: [attachments]
      operationId: putAttachment
      summary: Upload an attachment
      description: |
        CouchDB stores the request's `Content-Type` as the attachment's
        `content_type`, so send the real type (`image/png`, ...). Any media
        type is accepted; `application/octet-stream` is only the default.
      parameters:
        - name: rev
          in: query
          description: Current document revision (omit to create the document)
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
          "*/*":
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Attachment stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentResult" }
        "409": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    delete:
      tags: [attachments]
      operationId: deleteAttachment
      summary: Delete an attachment
      parameters:
        - name: rev
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Attachment deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentResult" }
        "409": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /_dbs_info:
    post:
      tags: [databases]
      operationId: postDbsInfo
      summary: Information about several databases at once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keys]
              properties:
                keys:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: One entry per requested name, in order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DbsInfoEntry" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /{db}/_design_docs:
    parameters:
      - { $ref: "#/components/parameters/Db" }
    get:
      tags: [query]
      operationId: getDesignDocs
      summary: List design documents
      parameters:
        - { $ref: "#/components/parameters/IncludeDocs" }
        - { $ref: "#/components/parameters/JsonStartKey" }
        - { $ref: "#/components/parameters/JsonEndKey" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Skip" }
        - { $ref: "#/components/parameters/Descending" }
      responses:
        "200":
          description: Rows
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AllDocsResult" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /{db}/_local_docs:
    parameters:
      - { $ref: "#/components/parameters/Db" }
    get:
      tags: [query]
      operationId: getLocalDocs
      summary: List local (non-replicated) documents
      parameters:
        - { $ref: "#/components/parameters/IncludeDocs" }
        - { $ref: "#/components/parameters/JsonStartKey" }
        - { $ref: "#/components/parameters/JsonEndKey" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Skip" }
        - { $ref: "#/components/parameters/Descending" }
      responses:
        "200":
          description: Rows (`total_rows` and `offset` are always null here)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalDocsResult" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /{db}/_purge:
    parameters:
      - { $ref: "#/components/parameters/Db" }
    post:
      tags: [maintenance]
      operationId: postPurge
      summary: Permanently remove revisions
      description: |
        Unlike deletion, purged revisions leave no tombstone and don't
        replicate. Body maps document ids to the revisions to remove.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: array
                items: { type: string }
      responses:
        "201":
          description: Purged revisions, keyed by document id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurgeResult" }
        "202":
          description: Purge accepted, quorum not met
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurgeResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /{db}/_explain:
    parameters:
      - { $ref: "#/components/parameters/Db" }
    post:
      tags: [query]
      operationId: postExplain
      summary: Show which index a Mango query would use
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FindQuery" }
      responses:
        "200":
          description: Query plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExplainResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /{db}/_compact:
    parameters:
      - { $ref: "#/components/parameters/Db" }
    post:
      tags: [maintenance]
      operationId: postCompact
      summary: Start compacting the database
      description: Runs in the background; check `compact_running` in the database info.
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object }
      responses:
        "202":
          description: Compaction started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /{db}/_view_cleanup:
    parameters:
      - { $ref: "#/components/parameters/Db" }
    post:
      tags: [maintenance]
      operationId: postViewCleanup
      summary: Remove index files no design document uses anymore
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object }
      responses:
        "202":
          description: Cleanup started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /_active_tasks:
    get:
      tags: [maintenance]
      operationId: getActiveTasks
      summary: Running tasks (compaction, indexing, replication)
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ActiveTask" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /_scheduler/jobs:
    get:
      tags: [replication]
      operationId: getSchedulerJobs
      summary: Replication jobs the scheduler is running
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Skip" }
      responses:
        "200":
          description: Jobs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchedulerJobs" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /_scheduler/docs:
    get:
      tags: [replication]
      operationId: getSchedulerDocs
      summary: State of replications defined in `_replicator` databases
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Skip" }
      responses:
        "200":
          description: Replication documents
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchedulerDocs" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /_db_updates:
    get:
      tags: [server]
      operationId: getDbUpdates
      summary: Feed of database creations, updates and deletions
      description: Needs the `_global_changes` database.
      parameters:
        - name: feed
          in: query
          description: "`continuous` streams newline-delimited JSON; read the raw response."
          schema: { type: string, enum: [normal, longpoll, continuous], default: normal }
        - name: since
          in: query
          schema: { type: string, default: "0" }
        - name: timeout
          in: query
          schema: { type: integer, minimum: 0 }
        - name: heartbeat
          in: query
          schema: { type: integer, minimum: 0 }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Descending" }
      responses:
        "200":
          description: Database events
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DbUpdatesResult" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: AuthSession
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT auth; needs `jwt_authentication` enabled on the server.

  parameters:
    Db:
      name: db
      in: path
      required: true
      description: Database name. System databases (`_users`, `_replicator`, ...) start with `_`.
      schema:
        type: string
        pattern: "^(_[a-z][a-z0-9_]*|[a-z][a-z0-9_$()+/-]*)$"
    DocId:
      name: docid
      in: path
      required: true
      schema: { type: string }
    Ddoc:
      name: ddoc
      in: path
      required: true
      description: Design document name without the `_design/` prefix
      schema: { type: string }
    Partition:
      name: partition
      in: path
      required: true
      schema: { type: string }
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: An `ETag` from an earlier response; the server answers 304 if it still matches.
      schema: { type: string }
    AttDocId:
      name: docid
      in: path
      required: true
      description: |
        Document id. Never starts with `_` on this path: `/{db}/_design/{ddoc}`
        and `/{db}/_local/{docid}` are separate operations.
      schema: { type: string, pattern: "^[^_]" }
    JsonKey:
      name: key
      in: query
      description: JSON-encoded key, e.g. `"abc"` (with quotes) or `[1,2]`.
      schema: { type: string }
    JsonStartKey:
      name: start_key
      in: query
      description: JSON-encoded key to start at.
      schema: { type: string }
    JsonEndKey:
      name: end_key
      in: query
      description: JSON-encoded key to end at.
      schema: { type: string }
    JsonKeys:
      name: keys
      in: query
      description: JSON-encoded array of keys.
      schema: { type: string }
    IncludeDocs:
      name: include_docs
      in: query
      schema: { type: boolean, default: false }
    InclusiveEnd:
      name: inclusive_end
      in: query
      schema: { type: boolean, default: true }
    IfMatch:
      name: If-Match
      in: header
      description: Document revision (alternative to `rev`)
      schema: { type: string }
    Descending:
      name: descending
      in: query
      schema: { type: boolean, default: false }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 0 }
    Skip:
      name: skip
      in: query
      schema: { type: integer, minimum: 0, default: 0 }

  headers:
    ETag:
      description: Current revision (documents) or content digest (attachments), quoted.
      schema: { type: string }

  responses:
    Error:
      description: CouchDB error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error, reason]
      properties:
        error: { type: string }
        reason: { type: string }

    Ok:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }

    ServerInformation:
      type: object
      required: [couchdb, version]
      properties:
        couchdb: { type: string }
        version: { type: string }
        git_sha: { type: string }
        uuid: { type: string }
        features:
          type: array
          items: { type: string }
        vendor:
          type: object
          properties:
            name: { type: string }

    UpInformation:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, maintenance_mode, nolb]
        seeds:
          type: object
          additionalProperties: true

    UuidsResult:
      type: object
      required: [uuids]
      properties:
        uuids:
          type: array
          items: { type: string }

    SessionRequest:
      type: object
      required: [name, password]
      properties:
        name: { type: string }
        password: { type: string, format: password }

    SessionCreated:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        name: { type: string, nullable: true }
        roles:
          type: array
          items: { type: string }

    SessionInformation:
      type: object
      required: [ok, userCtx]
      properties:
        ok: { type: boolean }
        userCtx:
          type: object
          properties:
            name: { type: string, nullable: true }
            roles:
              type: array
              items: { type: string }
        info:
          type: object
          properties:
            authenticated: { type: string }
            authentication_db: { type: string }
            authentication_handlers:
              type: array
              items: { type: string }

    DatabaseInformation:
      type: object
      required: [db_name]
      properties:
        db_name: { type: string }
        update_seq: { type: string }
        purge_seq: { type: string }
        doc_count: { type: integer }
        doc_del_count: { type: integer }
        compact_running: { type: boolean }
        instance_start_time: { type: string }
        sizes:
          type: object
          properties:
            active: { type: integer }
            external: { type: integer }
            file: { type: integer }
        props:
          type: object
          properties:
            partitioned: { type: boolean }

    Document:
      type: object
      description: A JSON document. Arbitrary user fields are allowed.
      additionalProperties: true
      properties:
        _id: { type: string }
        _rev: { type: string }
        _deleted: { type: boolean }
        _attachments:
          type: object
          additionalProperties: { $ref: "#/components/schemas/Attachment" }
        _conflicts:
          type: array
          items: { type: string }
        _revisions: { $ref: "#/components/schemas/Revisions" }

    Revisions:
      type: object
      description: Revision history, newest first. Full rev ids are `{start - i}-{ids[i]}`.
      required: [start, ids]
      properties:
        start: { type: integer }
        ids:
          type: array
          items: { type: string }

    Attachment:
      type: object
      properties:
        content_type: { type: string }
        data: { type: string, format: byte, description: Base64 body (inline only) }
        digest: { type: string }
        length: { type: integer }
        revpos: { type: integer }
        stub: { type: boolean }
        follows: { type: boolean }
        encoding: { type: string }
        encoded_length: { type: integer }

    DocumentResult:
      type: object
      properties:
        id: { type: string }
        rev: { type: string }
        ok: { type: boolean }
        error: { type: string }
        reason: { type: string }

    BulkDocs:
      type: object
      required: [docs]
      properties:
        docs:
          type: array
          items: { $ref: "#/components/schemas/Document" }
        new_edits: { type: boolean, default: true }

    AllDocsQuery:
      type: object
      properties:
        include_docs: { type: boolean, default: false }
        keys:
          type: array
          items: { type: string }
        start_key: { type: string }
        end_key: { type: string }
        limit: { type: integer, minimum: 0 }
        skip: { type: integer, minimum: 0 }
        descending: { type: boolean }

    AllDocsResult:
      type: object
      required: [rows]
      properties:
        total_rows: { type: integer }
        offset: { type: integer, nullable: true }
        update_seq: { type: string }
        rows:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              key: { type: string }
              value:
                type: object
                properties:
                  rev: { type: string }
                  deleted: { type: boolean }
              doc: { $ref: "#/components/schemas/Document" }
              error: { type: string }

    FindQuery:
      type: object
      required: [selector]
      properties:
        selector:
          type: object
          additionalProperties: true
        fields:
          type: array
          items: { type: string }
        sort:
          type: array
          description: 'Field/direction pairs, e.g. `[{"age": "desc"}]`. Direction is `asc` or `desc`.'
          items:
            type: object
            additionalProperties: { type: string }
        limit: { type: integer, minimum: 0 }
        skip: { type: integer, minimum: 0 }
        use_index:
          type: array
          items: { type: string }
        bookmark: { type: string }
        execution_stats: { type: boolean }

    FindResult:
      type: object
      required: [docs]
      properties:
        docs:
          type: array
          items: { $ref: "#/components/schemas/Document" }
        bookmark: { type: string }
        warning: { type: string }
        execution_stats:
          type: object
          additionalProperties: true

    IndexDefinitionRequest:
      type: object
      required: [index]
      properties:
        index:
          type: object
          required: [fields]
          properties:
            fields:
              type: array
              items: { type: string }
            partial_filter_selector:
              type: object
              additionalProperties: true
        ddoc: { type: string }
        name: { type: string }
        type:
          type: string
          enum: [json, text]
          default: json
        partitioned: { type: boolean }

    IndexResult:
      type: object
      properties:
        result:
          type: string
          enum: [created, exists]
        id: { type: string }
        name: { type: string }

    IndexesInformation:
      type: object
      required: [indexes]
      properties:
        total_rows: { type: integer }
        indexes:
          type: array
          items:
            type: object
            properties:
              ddoc: { type: string, nullable: true }
              name: { type: string }
              type: { type: string }
              partitioned: { type: boolean }
              def:
                type: object
                additionalProperties: true

    ViewQuery:
      type: object
      properties:
        include_docs: { type: boolean, default: false }
        reduce: { type: boolean }
        group: { type: boolean }
        group_level: { type: integer, minimum: 0 }
        keys:
          type: array
          items: {}
        key: {}
        start_key: {}
        end_key: {}
        startkey_docid: { type: string }
        endkey_docid: { type: string }
        inclusive_end: { type: boolean, default: true }
        limit: { type: integer, minimum: 0 }
        skip: { type: integer, minimum: 0 }
        descending: { type: boolean }
        conflicts: { type: boolean }
        attachments: { type: boolean }
        stable: { type: boolean }
        update_seq: { type: boolean }
        update:
          type: string
          enum: ["true", "false", lazy]

    ViewResult:
      type: object
      required: [rows]
      properties:
        total_rows: { type: integer }
        offset: { type: integer }
        rows:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              key: {}
              value: {}
              doc: { $ref: "#/components/schemas/Document" }

    ChangesResult:
      type: object
      required: [results, last_seq]
      properties:
        last_seq: { type: string }
        pending: { type: integer }
        results:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              seq: { type: string, nullable: true }
              deleted: { type: boolean }
              changes:
                type: array
                items:
                  type: object
                  properties:
                    rev: { type: string }
              doc: { $ref: "#/components/schemas/Document" }

    ChangesQuery:
      type: object
      properties:
        doc_ids:
          type: array
          items: { type: string }
        selector:
          type: object
          additionalProperties: true

    SecurityMembers:
      type: object
      properties:
        names:
          type: array
          items: { type: string }
        roles:
          type: array
          items: { type: string }

    Security:
      type: object
      properties:
        admins: { $ref: "#/components/schemas/SecurityMembers" }
        members: { $ref: "#/components/schemas/SecurityMembers" }

    DesignDocument:
      type: object
      additionalProperties: true
      properties:
        _id: { type: string }
        _rev: { type: string }
        language: { type: string, default: javascript }
        views:
          type: object
          additionalProperties:
            type: object
            properties:
              map: { type: string }
              reduce: { type: string }
              options:
                type: object
                additionalProperties: true
        filters:
          type: object
          description: Filter function name to JavaScript source
          additionalProperties: { type: string }
        updates:
          type: object
          description: Update handler name to JavaScript source
          additionalProperties: { type: string }
        validate_doc_update: { type: string }
        autoupdate: { type: boolean }
        options:
          type: object
          description: "Design document options, e.g. `{\"partitioned\": false}`"
          additionalProperties: true

    ReplicationRequest:
      type: object
      required: [source, target]
      properties:
        source: { $ref: "#/components/schemas/ReplicationEndpoint" }
        target: { $ref: "#/components/schemas/ReplicationEndpoint" }
        create_target: { type: boolean }
        continuous: { type: boolean }
        cancel: { type: boolean }
        doc_ids:
          type: array
          items: { type: string }
        selector:
          type: object
          additionalProperties: true

    ReplicationEndpoint:
      description: |
        A database URL (string), or an object with `url` and optional `auth`
        (e.g. `{"basic": {"username": ..., "password": ...}}`). Left untyped on
        purpose: `oneOf: [string, object]` breaks typescript-fetch.

    ReplicationResult:
      type: object
      properties:
        ok: { type: boolean }
        session_id: { type: string }
        source_last_seq: { type: string }
        _local_id: { type: string }
        no_changes: { type: boolean }
        replication_id_version: { type: integer }
        history:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              session_id: { type: string }
              start_time: { type: string }
              end_time: { type: string }
              start_last_seq:
                description: Sequence; a number or a string depending on server version
              end_last_seq:
                description: Sequence; a number or a string depending on server version
              recorded_seq:
                description: Sequence; a number or a string depending on server version
              missing_checked: { type: integer }
              missing_found: { type: integer }
              docs_read: { type: integer }
              docs_written: { type: integer }
              doc_write_failures: { type: integer }

    RevsDiffRequest:
      type: object
      description: Document id mapped to the revisions to check
      additionalProperties:
        type: array
        items: { type: string }

    RevsDiffResult:
      type: object
      description: Document id mapped to revisions the database is missing
      additionalProperties:
        type: object
        properties:
          missing:
            type: array
            items: { type: string }
          possible_ancestors:
            type: array
            items: { type: string }

    BulkGetRequest:
      type: object
      required: [docs]
      properties:
        docs:
          type: array
          items:
            type: object
            required: [id]
            properties:
              id: { type: string }
              rev: { type: string }
              atts_since:
                type: array
                items: { type: string }

    BulkGetResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              docs:
                type: array
                items:
                  type: object
                  properties:
                    ok: { $ref: "#/components/schemas/Document" }
                    error:
                      type: object
                      properties:
                        id: { type: string }
                        rev: { type: string }
                        error: { type: string }
                        reason: { type: string }

    DbsInfoEntry:
      type: object
      required: [key]
      properties:
        key: { type: string }
        info: { $ref: "#/components/schemas/DatabaseInformation" }
        error: { type: string }

    LocalDocsResult:
      type: object
      required: [rows]
      properties:
        total_rows: { type: integer, nullable: true }
        offset: { type: integer, nullable: true }
        rows:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              key: { type: string }
              value:
                type: object
                properties:
                  rev: { type: string }
              doc: { $ref: "#/components/schemas/Document" }

    PurgeResult:
      type: object
      required: [purged]
      properties:
        purge_seq: { type: string, nullable: true }
        purged:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

    ExplainResult:
      type: object
      additionalProperties: true
      properties:
        dbname: { type: string }
        index:
          type: object
          properties:
            ddoc: { type: string, nullable: true }
            name: { type: string }
            type: { type: string }
            def:
              type: object
              additionalProperties: true
        selector:
          type: object
          additionalProperties: true
        opts:
          type: object
          additionalProperties: true
        limit: { type: integer }
        skip: { type: integer }
        fields:
          description: '`"all_fields"` or a list of field names'

    ActiveTask:
      type: object
      additionalProperties: true
      properties:
        type: { type: string }
        database: { type: string }
        node: { type: string }
        pid: { type: string }
        progress: { type: integer }
        started_on: { type: integer }
        updated_on: { type: integer }

    SchedulerJobs:
      type: object
      required: [jobs]
      properties:
        total_rows: { type: integer }
        offset: { type: integer }
        jobs:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              id: { type: string }
              database: { type: string, nullable: true }
              doc_id: { type: string, nullable: true }
              source: { type: string }
              target: { type: string }
              user: { type: string, nullable: true }
              node: { type: string }
              pid: { type: string }
              start_time: { type: string }

    SchedulerDocs:
      type: object
      required: [docs]
      properties:
        total_rows: { type: integer }
        offset: { type: integer }
        docs:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              database: { type: string }
              doc_id: { type: string }
              id: { type: string, nullable: true }
              state: { type: string, nullable: true }
              source: { type: string }
              target: { type: string }
              error_count: { type: integer }
              last_updated: { type: string }

    DbUpdatesResult:
      type: object
      required: [results]
      properties:
        last_seq: { type: string }
        results:
          type: array
          items:
            type: object
            properties:
              db_name: { type: string }
              type: { type: string, description: "`created`, `updated` or `deleted`" }
              seq: { type: string }
