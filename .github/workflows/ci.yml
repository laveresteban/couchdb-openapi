name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20 }
      - run: npx --yes @stoplight/spectral-cli@6 lint openapi.yaml --fail-severity=warn
      - run: npx --yes @redocly/cli@1 lint openapi.yaml
  breaking-changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - run: git show origin/${{ github.base_ref }}:openapi.yaml > base.yaml
      - uses: oasdiff/oasdiff-action/breaking@v0.1.20
        with:
          base: base.yaml
          revision: openapi.yaml
          fail-on: ERR
