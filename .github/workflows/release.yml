# On a spec tag (v1.2.3), tell the generator repo to regenerate every SDK,
# but only once the spec passes its own CI (lint + breaking-change check).
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  notify-generator:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.SDK_BOT_TOKEN }}
          repository: ${{ github.repository_owner }}/couchdb-sdk-generator
          event-type: spec-released
          client-payload: '{"spec_ref": "${{ github.ref_name }}"}'
